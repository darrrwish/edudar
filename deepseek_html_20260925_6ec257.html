<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edudar — منصة التعلم الطبي</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f1a'/%3E%3Ctext x='32' y='45' font-family='Arial' font-size='34' font-weight='800' fill='%232dd4bf' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg0:#06090f;--bg1:#0a0f1a;--bg2:#0f1625;--bg3:#141c2e;--bg4:#1a2338;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);--line3:rgba(255,255,255,.16);
  --teal:#2dd4bf;--teal-d:#0f9d8b;--teal-g:rgba(45,212,191,.18);--teal-soft:rgba(45,212,191,.08);
  --amber:#fbbf24;--amber-d:#d97706;
  --red:#f87171;--green:#34d399;--blue:#60a5fa;--purple:#a78bfa;
  --text0:#f1f5f9;--text1:#94a3b8;--text2:#64748b;--text3:#334155;
  --wa:#25d366;
  --font:'IBM Plex Sans Arabic',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;--r24:24px;
  --ease:cubic-bezier(.16,1,.3,1);
  --bar-h:60px;--sb-w:280px;
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg0);color:var(--text0);height:100dvh;overflow:hidden;line-height:1.65;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
a{color:var(--teal);text-decoration:none}
button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--text1)}
.small{font-size:.8rem}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2.5px solid var(--bg4);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;vertical-align:middle}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(14px);z-index:9999;padding:.7rem 1.4rem;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r24);font-size:.83rem;color:var(--text0);opacity:0;pointer-events:none;transition:all .28s var(--ease);white-space:nowrap;box-shadow:var(--shadow-lg);max-width:90vw;text-overflow:ellipsis;overflow:hidden;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(45,212,191,.5);color:var(--teal);background:rgba(15,25,35,.98)}
#toast.err{border-color:rgba(248,113,113,.5);color:var(--red);background:rgba(35,15,20,.98)}
#toast.warn{border-color:rgba(251,191,36,.5);color:var(--amber);background:rgba(35,28,15,.98)}
#bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 80% 20%,rgba(45,212,191,.05) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 10% 80%,rgba(251,191,36,.04) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 50% 50%,rgba(96,165,250,.02) 0%,transparent 70%)}
#bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}
#screen-login{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:var(--bg0);padding:1rem;overflow-y:auto}
.login-wrap{width:min(460px,100%);animation:fadeUp .55s var(--ease);padding:1rem 0}
.login-brand{text-align:center;margin-bottom:2.2rem}
.login-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--teal-d),var(--teal));display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;box-shadow:0 12px 40px rgba(45,212,191,.35),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.login-mark::after{content:'';position:absolute;inset:-6px;border-radius:24px;background:radial-gradient(circle,rgba(45,212,191,.25),transparent 70%);z-index:-1;filter:blur(12px)}
.login-mark svg{width:32px;height:32px;color:#fff}
.login-brand h1{font-size:2rem;font-weight:700;letter-spacing:-.035em;background:linear-gradient(135deg,#fff 30%,var(--teal) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-brand p{font-size:.85rem;color:var(--text1);margin-top:.3rem}
.login-box{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line2);border-radius:var(--r24);padding:2rem;box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.04)}
.login-tabs{display:flex;gap:.4rem;background:var(--bg1);border-radius:var(--r12);padding:.35rem;margin-bottom:1.6rem;border:1px solid var(--line)}
.login-tab{flex:1;padding:.58rem;border-radius:var(--r8);background:transparent;border:none;font-family:var(--font);font-size:.83rem;color:var(--text2);transition:all .22s var(--ease);font-weight:500;display:flex;align-items:center;justify-content:center;gap:.4rem}
.login-tab svg{width:14px;height:14px}
.login-tab.active{background:var(--bg4);color:var(--text0);box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.form-group{margin-bottom:1rem}
.form-label{display:flex;align-items:center;gap:.38rem;font-size:.79rem;color:var(--text1);margin-bottom:.42rem;font-weight:500}
.form-label svg{width:13px;height:13px;flex-shrink:0;color:var(--text2)}
.form-input{width:100%;padding:.72rem .95rem;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r8);color:var(--text0);font-family:var(--font);font-size:.9rem;transition:border-color .2s,box-shadow .2s,background .2s;outline:none;direction:rtl}
.form-input::placeholder{color:var(--text2)}
.form-input:hover{border-color:var(--line3)}
.form-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.12);background:var(--bg2)}
.form-hint{font-size:.73rem;color:var(--text2);margin-top:.35rem;line-height:1.7}
.form-error{font-size:.76rem;color:var(--red);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:var(--r8);padding:.55rem .85rem;margin-top:.5rem;display:none}
.form-error.show{display:block}
.btn-primary{width:100%;padding:.78rem;background:linear-gradient(135deg,var(--teal-d),var(--teal));border:none;border-radius:var(--r8);color:#fff;font-family:var(--font);font-size:.92rem;font-weight:600;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem;box-shadow:0 6px 20px rgba(45,212,191,.28)}
.btn-primary:hover{opacity:.95}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.login-hint{text-align:center;font-size:.72rem;color:var(--text2);margin-top:.9rem}
.review-box{background:linear-gradient(180deg,rgba(167,139,250,.09),rgba(167,139,250,.04));border:1px solid rgba(167,139,250,.28);border-radius:var(--r16);padding:1.6rem 1.4rem;text-align:center;color:var(--purple)}
.review-box svg{width:38px;height:38px;margin-bottom:.7rem}
.review-box h3{font-size:1.05rem;margin-bottom:.4rem;font-weight:600}
.review-box p{font-size:.82rem;color:var(--text1);margin-bottom:.8rem;line-height:1.75}
#topbar{position:fixed;top:0;inset-inline:0;height:var(--bar-h);z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:0 1rem;background:rgba(6,9,15,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line)}
.topbar-nav{display:flex;align-items:center;gap:.4rem;justify-self:start}
.topbar-brand{display:flex;align-items:center;justify-self:center;cursor:pointer;user-select:none}
.topbar-name{font-size:1.28rem;font-weight:700;letter-spacing:-.025em;background:linear-gradient(135deg,var(--text0) 40%,var(--teal) 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar-user{display:flex;align-items:center;justify-self:end;gap:.4rem}
.t-badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:16px;height:16px;padding:0 4px;background:var(--red);color:#fff;border-radius:99px;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--bg0)}
.uc-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--teal-d),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;flex-shrink:0;font-size:.7rem;font-weight:700}
.uc-avatar svg{width:14px;height:14px}
.btn-icon{width:36px;height:36px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--text1);transition:all .18s var(--ease);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.btn-icon svg{width:16px;height:16px}
.btn-icon:hover{background:var(--bg2);border-color:var(--line2);color:var(--text0)}
.btn-icon.active{background:var(--teal-soft);border-color:rgba(45,212,191,.32);color:var(--teal)}
.btn-icon.danger:hover{border-color:rgba(248,113,113,.5);color:var(--red);background:rgba(248,113,113,.08)}
.btn-icon[disabled]{opacity:.35;cursor:not-allowed}
.topbar-stu-only{display:flex}
#sidebar{position:fixed;top:var(--bar-h);inset-inline-start:0;width:var(--sb-w);height:calc(100dvh - var(--bar-h));z-index:80;background:var(--bg1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;transition:transform .34s var(--ease)}
#sidebar.closed{transform:translateX(100%)}
.sb-head{padding:.95rem .85rem .7rem;border-bottom:1px solid var(--line);flex-shrink:0}
.sb-head-lbl{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.sb-search{margin-top:.55rem;position:relative}
.sb-search input{width:100%;padding:.5rem .85rem .5rem 2rem;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r8);color:var(--text0);font-size:.79rem;outline:none}
.sb-search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.1)}
.sb-search-ic{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}
.sb-search-ic svg{width:13px;height:13px}
.sb-list{flex:1;overflow-y:auto;padding:.5rem}
.sb-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .68rem;border-radius:var(--r8);cursor:pointer;transition:all .18s var(--ease);margin-bottom:.15rem;border:1px solid transparent;position:relative}
.sb-item:hover{background:var(--bg2);border-color:var(--line)}
.sb-item.active{background:var(--teal-soft);border-color:rgba(45,212,191,.22)}
.sb-item.active::before{content:'';position:absolute;inset-inline-start:-1px;top:20%;bottom:20%;width:2px;background:var(--teal);border-radius:2px}
.sb-item.locked{opacity:.45;cursor:not-allowed}
.sb-num{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;background:var(--bg3);color:var(--text2);font-family:var(--mono)}
.sb-num svg{width:12px;height:12px}
.sb-item.active .sb-num{background:rgba(45,212,191,.16);color:var(--teal)}
.sb-item.done .sb-num{background:rgba(52,211,153,.14);color:var(--green)}
.sb-info{flex:1;min-width:0}
.sb-title{font-size:.79rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text1);font-weight:500}
.sb-item.active .sb-title,.sb-item:hover .sb-title{color:var(--text0)}
.sb-meta{font-size:.66rem;color:var(--text2);margin-top:.1rem}
.sb-score{color:var(--teal);font-weight:600;font-family:var(--mono)}
#main{position:fixed;top:var(--bar-h);inset-inline-start:var(--sb-w);inset-inline-end:0;bottom:0;overflow-y:auto;padding:1.5rem 2rem 2.5rem;z-index:10;transition:inset-inline-start .34s var(--ease)}
#main.nosb{inset-inline-start:0}
.loading-center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;gap:1rem;color:var(--text1);font-size:.85rem}
.lesson-card{background:linear-gradient(180deg,var(--bg1),rgba(10,15,26,.85));border:1px solid var(--line);border-radius:var(--r16);padding:1.8rem 2.1rem;margin-bottom:1.2rem;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.lesson-tag{display:inline-flex;align-items:center;gap:.32rem;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);border:1px solid rgba(45,212,191,.22);padding:.22rem .68rem;border-radius:var(--r24);margin-bottom:.65rem}
.lesson-tag svg{width:11px;height:11px}
.lesson-title{font-size:clamp(1.28rem,3vw,1.65rem);font-weight:700;letter-spacing:-.025em;margin-bottom:.22rem;line-height:1.35}
.lesson-sub{font-size:.87rem;color:var(--text1)}
.lesson-divider{height:1px;background:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent);margin:1.1rem 0}
.lesson-body{font-size:.88rem;line-height:1.9;color:rgba(241,245,249,.85)}
.lesson-body h2{font-size:1.16rem;color:var(--text0);margin:1.5rem 0 .6rem;border-bottom:1px solid var(--line);padding-bottom:.42rem}
.lesson-body h3{font-size:1rem;color:var(--teal);margin:1.1rem 0 .5rem}
.lesson-body h4{font-size:.92rem;color:var(--amber);margin:.95rem 0 .42rem}
.lesson-body p{margin-bottom:.8rem}
.lesson-body b,.lesson-body strong{color:var(--text0);font-weight:600}
.lesson-body code{font-family:var(--mono);font-size:.8rem;background:var(--bg3);color:var(--teal);padding:.1rem .42rem;border-radius:4px;border:1px solid var(--line2)}
.lesson-body ul,.lesson-body ol{padding-inline-start:1.4rem;margin-bottom:.8rem}
.lesson-body li{margin-bottom:.32rem}
.lesson-body table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.83rem}
.lesson-body table th{background:var(--bg3);color:var(--teal);padding:.6rem .9rem;text-align:right;border:1px solid var(--line2)}
.lesson-body table td{padding:.55rem .9rem;border:1px solid var(--line)}
.lesson-body .card-info{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r12);padding:1rem 1.2rem;margin:1rem 0}
.lesson-body .card-warn{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:var(--r12);padding:1rem 1.2rem;margin:1rem 0;border-inline-start:3px solid var(--amber)}
.lesson-body .card-danger{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:var(--r12);padding:1rem 1.2rem;margin:1rem 0;border-inline-start:3px solid var(--red)}
.video-wrap{position:relative;margin:1rem 0;border-radius:var(--r12);overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.video-wrap iframe,.video-wrap video{width:100%;height:100%;border:none;display:block}
.video-label{display:flex;align-items:center;gap:.4rem;padding:.55rem .9rem;background:var(--bg2);border-top:1px solid var(--line);font-size:.74rem;color:var(--text1)}
.video-label svg{width:13px;height:13px;color:var(--teal)}
.audio-wrap{display:flex;align-items:center;gap:.8rem;padding:.85rem 1.05rem;margin:.85rem 0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r12)}
.audio-wrap svg{width:18px;height:18px;color:var(--teal)}
.audio-wrap audio{flex:1;height:32px}
.quiz-acc{margin-top:1.4rem;border:1px solid var(--line);border-radius:var(--r12);overflow:hidden;background:var(--bg2)}
.quiz-acc-hdr{display:flex;align-items:center;justify-content:space-between;padding:.95rem 1.1rem;cursor:pointer;user-select:none;transition:background .18s}
.quiz-acc-hdr:hover{background:var(--bg3)}
.quiz-acc-title{display:flex;align-items:center;gap:.5rem;font-size:.88rem;font-weight:600}
.quiz-acc-title svg{width:16px;height:16px;color:var(--teal)}
.quiz-acc-arrow{width:18px;height:18px;color:var(--text2);transition:transform .28s var(--ease)}
.quiz-acc-arrow.open{transform:rotate(180deg)}
.quiz-acc-body{display:none;padding:1.1rem;background:var(--bg1);border-top:1px solid var(--line)}
.quiz-acc-body.open{display:block}
.q-block{margin-bottom:1.1rem}
.q-text{font-size:.85rem;font-weight:600;color:var(--text0);margin-bottom:.5rem}
.q-opts{display:flex;flex-direction:column;gap:.3rem}
.q-opt{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;border-radius:var(--r8);cursor:pointer;font-size:.8rem;color:var(--text1);border:1px solid transparent;background:var(--bg2);transition:all .15s}
.q-opt:hover{background:var(--bg3);border-color:var(--line2);color:var(--text0)}
.q-opt.selected{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.4);color:var(--text0)}
.q-opt.correct-opt{background:rgba(34,197,94,.16)!important;border-color:rgba(34,197,94,.55)!important;color:var(--text0)}
.q-opt.wrong-opt{background:rgba(239,68,68,.16)!important;border-color:rgba(239,68,68,.55)!important;color:var(--text0)}
.q-opt.locked{pointer-events:none;cursor:default}
.q-opt input[type=radio]{accent-color:var(--teal);flex-shrink:0;width:15px;height:15px;cursor:pointer}
.quiz-result{margin-top:.9rem;padding:.7rem 1rem;border-radius:var(--r8);font-size:.82rem;font-weight:600;text-align:center;display:none}
.quiz-result.show{display:block}
.quiz-result.pass{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.quiz-result.fail{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.btn-quiz{display:inline-flex;align-items:center;gap:.42rem;margin-top:.95rem;padding:.55rem 1.2rem;background:var(--teal-soft);border:1px solid rgba(45,212,191,.32);border-radius:var(--r8);color:var(--teal);font-size:.81rem;font-weight:600;transition:all .18s}
.btn-quiz:hover{background:rgba(45,212,191,.18)}
.btn-quiz svg{width:14px;height:14px}
.lesson-locked-banner{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);border-radius:var(--r12);padding:1.05rem 1.3rem;display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;color:var(--amber);font-size:.85rem}
.lesson-locked-banner svg{width:20px;height:20px;flex-shrink:0}
.status-banner{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.22);border-radius:var(--r12);padding:1.05rem 1.3rem;display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;color:var(--red);font-size:.85rem}
.status-banner.info{background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.22);color:var(--blue)}
.status-banner.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.22);color:var(--amber)}
.status-banner svg{width:20px;height:20px;flex-shrink:0}
#exam-modal,#student-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:1rem}
#student-modal{z-index:300}
.exam-box,.sm-box{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line2);border-radius:var(--r24);width:100%;max-width:700px;max-height:90dvh;overflow-y:auto;padding:1.9rem;box-shadow:var(--shadow-lg);position:relative}
.modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.4rem;gap:.8rem}
.modal-title{font-size:1.15rem;font-weight:700;margin-bottom:.22rem;line-height:1.4}
.modal-sub{font-size:.79rem;color:var(--text1)}

<script>
/* ==================== CONFIG ==================== */
const CFG = { pageSize: 12, prereqs: true };
const LS = 'edudar_v9';
const SUPABASE_URL = 'https://jsucietobexyputikfsd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_G9zAsW02qk1kMNlc5VFIug_M9x7m2eL';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SESSION_KEY = 'edudar_session_v1';
const saveSession = u => localStorage.setItem(SESSION_KEY, JSON.stringify(u));
const loadSession = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } };
const clearSession = () => localStorage.removeItem(SESSION_KEY);

const ROLES = { admin:{label:'مسؤول كامل',badge:'b-teal'}, viewer:{label:'مشاهد',badge:'b-blue'} };
const STU_STATUSES = {
  active:{label:'نشط',badge:'b-green'}, suspended:{label:'معلق',badge:'b-amber'},
  banned:{label:'محظور',badge:'b-red'}, under_review:{label:'تحت مراجعة',badge:'b-purple'}
};

/* ==================== STORAGE ==================== */
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const lsSave = d => localStorage.setItem(LS, JSON.stringify(d));

/* ==================== CLOUD LAYER ==================== */
const Cloud = {
  async syncLessons() {
    if (!S.user || !S.isAdmin) return false;
    try {
      const payload = { _lessons: S.lessons, _examsExtra: S.examsExtra, _updated: new Date().toISOString() };
      const { error } = await sb.rpc('upsert_app_setting', { p_key: 'lessons_data', p_value: payload });
      if (error) throw new Error(error.message);
      _setCloudStatus('ok');
      return true;
    } catch(e) { console.warn('sync failed:', e.message); _setCloudStatus('err', e.message); return false; }
  },
  async loadLessons() {
    try {
      const { data, error } = await sb.rpc('get_app_setting', { p_key: 'lessons_data' });
      if (error || !data || !data.length) return null;
      return data[0]?.value || null;
    } catch(e) { return null; }
  },
  async saveScore(phone, refId, type, correct, total) {
    try {
      const { error } = await sb.from('student_scores').upsert({
        student_phone: phone, ref_id: String(refId), type, correct, total,
        updated_at: new Date().toISOString()
      }, { onConflict: 'student_phone,ref_id,type' });
      if (error) throw error;
      return true;
    } catch(e) { console.warn('saveScore:', e.message); return false; }
  },
  async loadStudentScores(phone) {
    try {
      const { data, error } = await sb.from('student_scores').select('*').eq('student_phone', phone);
      if (error) throw error;
      const scores = {}, exScores = {};
      (data||[]).forEach(r => {
        const item = { correct: r.correct, total: r.total };
        if (r.type === 'lesson') scores[String(r.ref_id)] = item;
        else exScores[String(r.ref_id)] = item;
      });
      return { scores, exScores };
    } catch(e) { return null; }
  },
  async loadAllScores() {
    try {
      const { data, error } = await sb.from('student_scores').select('*');
      if (error) throw error;
      return (data||[]).map(r => ({
        student_id: r.student_phone, ref_id: String(r.ref_id),
        correct: r.correct, total: r.total, type: r.type
      }));
    } catch(e) { return []; }
  },
  async sendMessage(msg) {
    try {
      const { error } = await sb.from('admin_messages').insert({
        id: msg.id, from_phone: msg.from, from_name: msg.fromName,
        body: msg.body, time: msg.time, read: false, edited: false, replies: []
      });
      if (error) throw error;
      return true;
    } catch(e) { return false; }
  },
  async loadMessagesFrom(phone) {
    try {
      const { data, error } = await sb.from('admin_messages').select('*').eq('from_phone', phone).order('time', { ascending: true });
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, from: r.from_phone, fromName: r.from_name, body: r.body,
        time: r.time, read: r.read, edited: r.edited, replies: r.replies || []
      }));
    } catch(e) { return []; }
  },
  async loadAllMessages() {
    try {
      const { data, error } = await sb.from('admin_messages').select('*').order('time', { ascending: false });
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, from: r.from_phone, fromName: r.from_name, body: r.body,
        time: r.time, read: r.read, edited: r.edited, replies: r.replies || []
      }));
    } catch(e) { return []; }
  },
  async updateMessage(id, body) {
    try { await sb.from('admin_messages').update({ body, edited: true }).eq('id', id); return true; }
    catch(e) { return false; }
  },
  async deleteMessage(id) {
    try { await sb.from('admin_messages').delete().eq('id', id); return true; }
    catch(e) { return false; }
  },
  async addReply(id, reply) {
    try {
      const { data, error: gErr } = await sb.from('admin_messages').select('replies').eq('id', id).single();
      if (gErr) throw gErr;
      const replies = [...(data?.replies || []), reply];
      await sb.from('admin_messages').update({ replies, read: true }).eq('id', id);
      return true;
    } catch(e) { return false; }
  },
  async deleteReply(id, replyId) {
    try {
      const { data, error: gErr } = await sb.from('admin_messages').select('replies').eq('id', id).single();
      if (gErr) throw gErr;
      const replies = (data?.replies || []).filter(r => r.id !== replyId);
      await sb.from('admin_messages').update({ replies }).eq('id', id);
      return true;
    } catch(e) { return false; }
  },
  async markMessagesRead(phone) {
    try { await sb.from('admin_messages').update({ read: true }).eq('from_phone', phone); return true; }
    catch(e) { return false; }
  },
  async sendNotification(n) {
    try {
      await sb.from('notifications').insert({
        id: n.id, target: n.target, title: n.title, body: n.body,
        time: n.time, from_user: n.from || 'admin', seen_by: []
      });
      return true;
    } catch(e) { return false; }
  },
  async loadAllNotifications() {
    try {
      const { data, error } = await sb.from('notifications').select('*').order('time', { ascending: false });
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, target: r.target, title: r.title, body: r.body,
        time: r.time, from: r.from_user, seenBy: r.seen_by || []
      }));
    } catch(e) { return []; }
  },
  async loadNotificationsFor(phone) {
    try {
      const { data, error } = await sb.from('notifications').select('*')
        .or(`target.eq.all,target.eq.${phone}`).order('time', { ascending: false });
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, target: r.target, title: r.title, body: r.body,
        time: r.time, from: r.from_user, seenBy: r.seen_by || []
      }));
    } catch(e) { return []; }
  },
  async markNotificationSeen(id, phone) {
    try {
      const { data, error: gErr } = await sb.from('notifications').select('seen_by').eq('id', id).single();
      if (gErr) throw gErr;
      const arr = data?.seen_by || [];
      if (!arr.includes(phone)) {
        arr.push(phone);
        await sb.from('notifications').update({ seen_by: arr }).eq('id', id);
      }
      return true;
    } catch(e) { return false; }
  },
  async deleteNotification(id) {
    try { await sb.from('notifications').delete().eq('id', id); return true; }
    catch(e) { return false; }
  },
  async createPoll(poll) {
    try {
      await sb.from('polls').insert({
        id: poll.id, class_id: poll.classId, question: poll.question,
        options: poll.options, votes: poll.votes, created: poll.created, active: true
      });
      return true;
    } catch(e) { return false; }
  },
  async loadPollsForClass(classId) {
    try {
      const { data, error } = await sb.from('polls').select('*').eq('class_id', classId).eq('active', true);
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, classId: r.class_id, question: r.question,
        options: r.options || [], votes: r.votes || {}, created: r.created, active: r.active
      }));
    } catch(e) { return []; }
  },
  async loadAllPolls() {
    try {
      const { data, error } = await sb.from('polls').select('*').order('created', { ascending: false });
      if (error) throw error;
      return (data||[]).map(r => ({
        id: r.id, classId: r.class_id, question: r.question,
        options: r.options || [], votes: r.votes || {}, created: r.created, active: r.active
      }));
    } catch(e) { return []; }
  },
  async votePoll(id, optionIdx, phone) {
    try {
      const { data, error: gErr } = await sb.from('polls').select('votes').eq('id', id).single();
      if (gErr) throw gErr;
      const votes = data?.votes || {};
      Object.keys(votes).forEach(k => { votes[k] = (votes[k]||[]).filter(p => p !== phone); });
      if (!votes[optionIdx]) votes[optionIdx] = [];
      votes[optionIdx].push(phone);
      await sb.from('polls').update({ votes }).eq('id', id);
      return true;
    } catch(e) { return false; }
  },
  async closePoll(id) {
    try { await sb.from('polls').update({ active: false }).eq('id', id); return true; }
    catch(e) { return false; }
  },
  async deletePoll(id) {
    try { await sb.from('polls').delete().eq('id', id); return true; }
    catch(e) { return false; }
  },
  /* ---- NEW: fetch current user row from DB to detect suspend/class change ---- */
  async fetchUserById(id) {
    if (!id) return null;
    // Try common table names
    const candidates = ['users', 'user_accounts', 'accounts'];
    for (const t of candidates) {
      try {
        const { data, error } = await sb.from(t).select('status, class_id, role, name, phone').eq('id', id).maybeSingle();
        if (!error && data) return data;
      } catch(e) { /* try next */ }
    }
    return null;
  }
};

function _applyCloudData(cloudData) {
  S.lessons = cloudData._lessons;
  S.examsExtra = cloudData._examsExtra || [];
  S.lessons.forEach(l => {
    (l.quiz?.qs||[]).forEach(q => { if (!q.type) q.type = 'mcq'; });
    (l.exam?.qs||[]).forEach(q => { if (!q.type) q.type = 'mcq'; });
  });
  S.examsExtra.forEach(e => (e.qs||[]).forEach(q => { if (!q.type) q.type = 'mcq'; }));
  const db = lsGet();
  db._lessons = S.lessons;
  db._examsExtra = S.examsExtra;
  db._updated = cloudData._updated || new Date().toISOString();
  lsSave(db);
}
async function _doCloudRefresh() {
  const cloudData = await Cloud.loadLessons();
  if (!cloudData?._lessons?.length) return false;
  const localUpdated = lsGet()._updated || '';
  const cloudUpdated = cloudData._updated || '';
  if (!localUpdated || cloudUpdated > localUpdated) {
    _applyCloudData(cloudData);
    _setCloudStatus('ok');
    return true;
  }
  _setCloudStatus('ok');
  return false;
}
function _setCloudStatus(state, msg) {
  const dot = document.getElementById('cloud-dot');
  if (!dot) return;
  const colors = { ok: 'var(--green)', err: 'var(--red)', sync: 'var(--amber)' };
  const tips = { ok: 'السحابة متزامنة', err: 'فشل: ' + (msg||''), sync: 'جارٍ الحفظ...' };
  dot.style.background = colors[state] || colors.sync;
  dot.title = tips[state] || '';
  dot.classList.remove('hidden');
}

/* ==================== LIVE REFRESH LOOP (NEW) ==================== */
async function checkUserStatus() {
  if (!S.user?.id || S.isAdmin) return;
  try {
    const row = await Cloud.fetchUserById(S.user.id);
    if (!row) return;
    // Kick out if suspended/banned
    if (row.status === 'suspended' || row.status === 'banned') {
      stopLiveLoop();
      const msg = row.status === 'banned' ? 'تم حظر حسابك من قبل الإدارة' : 'تم تعليق حسابك من قبل الإدارة';
      toast(msg + ' — سيتم تسجيل خروجك تلقائياً', 'err', 5000);
      setTimeout(() => { try { logout(); } catch(e){} }, 1500);
      return;
    }
    // Detect class change / name change / status change
    let changed = false;
    if (row.class_id !== S.user.classId) { S.user.classId = row.class_id; changed = true; }
    if (row.name && row.name !== S.user.name) { S.user.name = row.name; changed = true; }
    if (row.status && row.status !== S.user.status) { S.user.status = row.status; changed = true; }
    if (changed) {
      saveSession({ ...S.user, role: S.role });
      updateChip();
      await loadScores(S.user.phone);
      buildSb();
      if (!document.getElementById('view-lessons')?.classList.contains('hidden')) renderLesson(S.lessonIdx);
      if (!document.getElementById('view-dash')?.classList.contains('hidden')) renderDash();
      if (!document.getElementById('view-exams')?.classList.contains('hidden')) renderExams();
      toast('تم تحديث بياناتك تلقائياً', 'ok', 3000);
    }
  } catch(e) { /* silent */ }
}
async function refreshContentQuiet() {
  if (!S.user) return;
  const updated = await _doCloudRefresh();
  if (updated) {
    // Re-render current view
    buildSb();
    const vLessons = document.getElementById('view-lessons');
    const vExams = document.getElementById('view-exams');
    const vDash = document.getElementById('view-dash');
    if (!vLessons?.classList.contains('hidden')) renderLesson(S.lessonIdx);
    if (!vExams?.classList.contains('hidden')) renderExams();
    if (!vDash?.classList.contains('hidden')) renderDash();
  }
}
function startLiveLoop() {
  stopLiveLoop();
  if (S.isAdmin) return;
  _liveInterval = setInterval(async () => {
    if (!S.user || S.isAdmin || _liveBusy) return;
    if (document.hidden) return; // skip if tab hidden
    _liveBusy = true;
    try {
      await checkUserStatus();
      await refreshContentQuiet();
    } catch(e) { /* ignore */ }
    _liveBusy = false;
  }, 30000); // every 30 seconds
}
function stopLiveLoop() {
  if (_liveInterval) { clearInterval(_liveInterval); _liveInterval = null; }
}

/* ==================== VISIBILITY ==================== */
function lessonVisibleToStudent(lesson) {
  if (!S.user || S.isAdmin) return true;
  if (!lesson.classIds || !lesson.classIds.length) return true;
  if (!S.user.classId) return false;
  return lesson.classIds.includes(S.user.classId);
}
function examVisibleToStudent(exam) {
  if (!S.user || S.isAdmin) return true;
  if (exam.type === 'comprehensive') {
    if (exam.classIds && exam.classIds.length) {
      if (!S.user.classId) return false;
      return exam.classIds.includes(S.user.classId);
    }
    return true;
  }
  return true;
}

/* ==================== SIDEBAR ==================== */
function isLessonUnlocked(idx) {
  if (!CFG.prereqs || idx === 0) return true;
  const prev = S.lessons[idx - 1];
  if (!prev) return true;
  if (!lessonVisibleToStudent(prev)) return true;
  const sc = S.scores[String(prev.id)];
  return sc && pct(sc.correct, sc.total) >= 60;
}
function buildSb() {
  const list = document.getElementById('sb-list');
  list.innerHTML = '';
  const visibleLessons = S.lessons.filter(lessonVisibleToStudent);
  let counter = 0;
  visibleLessons.forEach((l) => {
    counter++;
    const realIdx = S.lessons.indexOf(l);
    const sc = S.scores[String(l.id)];
    const done = !!sc;
    const locked = !isLessonUnlocked(realIdx);
    const p = done ? pct(sc.correct, sc.total) : null;
    const div = document.createElement('div');
    div.className = `sb-item${realIdx===S.lessonIdx?' active':''}${done?' done':''}${locked?' locked':''}`;
    div.innerHTML = `
      <div class="sb-num">${locked ? ic('lock') : done ? ic('check') : counter}</div>
      <div class="sb-info">
        <div class="sb-title">${l.title}</div>
        <div class="sb-meta">${done ? `<span class="sb-score">${p}%</span>` : locked ? '<span>مغلق</span>' : '<span>لم يُختبر</span>'}</div>
      </div>`;
    if (!locked) div.addEventListener('click', () => { goLesson(realIdx); if(window.innerWidth<=1024) closeSb(); });
    list.appendChild(div);
  });
}
function filterSb() {
  const q = document.getElementById('sb-inp').value.toLowerCase();
  document.querySelectorAll('#sb-list .sb-item').forEach(el => {
    el.style.display = el.querySelector('.sb-title').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
function setSbActive(idx) {
  const visible = S.lessons.filter(lessonVisibleToStudent);
  document.querySelectorAll('#sb-list .sb-item').forEach((el,i) => {
    el.classList.toggle('active', visible[i] && S.lessons.indexOf(visible[i])===idx);
  });
}
let _sbOpen = false;
function openSb() {
  _sbOpen = true;
  const sb = document.getElementById('sidebar');
  sb.classList.remove('closed'); sb.classList.add('open');
  const fi = document.getElementById('fab-ic');
  if (fi) fi.innerHTML = '<use href="#ic-x"/>';
  if (window.innerWidth <= 1024) document.getElementById('sb-overlay').classList.add('show');
}
function toggleSb() { if (_sbOpen) closeSb(); else openSb(); }
function closeSb() {
  _sbOpen = false;
  const sb = document.getElementById('sidebar');
  sb.classList.remove('open'); sb.classList.add('closed');
  const fi = document.getElementById('fab-ic');
  if (fi) fi.innerHTML = '<use href="#ic-menu"/>';
  document.getElementById('sb-overlay').classList.remove('show');
}
function closeAllSb() { closeSb(); }

/* ==================== VIEWS ==================== */
async function showView(view) {
  ['lessons','exams','dash','msg','admin'].forEach(v => {
    document.getElementById(`view-${v}`)?.classList.toggle('hidden', v!==view);
  });
  const navMap = { msg:'nav-msg', dash:'nav-dash-btn', exams:'nav-exams-btn' };
  Object.entries(navMap).forEach(([v,id]) => {
    document.getElementById(id)?.classList.toggle('active', v===view);
  });
  document.getElementById('main').scrollTop = 0;
  if (view==='lessons') {
    // Refresh content silently first
    if (S.user && !S.isAdmin) { try { await _doCloudRefresh(); } catch(e){} }
    if (!lessonVisibleToStudent(S.lessons[S.lessonIdx])) {
      const firstVisible = S.lessons.findIndex(lessonVisibleToStudent);
      S.lessonIdx = firstVisible >= 0 ? firstVisible : 0;
    }
    renderLesson(S.lessonIdx);
  }
  if (view==='exams') renderExams();
  if (view==='dash')  renderDash();
  if (view==='msg')   renderMessages();
  if (view==='admin') renderAdmin();
  if ((view==='exams'||view==='dash'||view==='msg') && window.innerWidth<=1024) closeSb();
}
function goLesson(idx) {
  if (!lessonVisibleToStudent(S.lessons[idx])) { toast('هذا الدرس غير متاح لصفك','warn'); return; }
  S.lessonIdx = idx; setSbActive(idx); showView('lessons');
}

/* ==================== LESSON RENDER ==================== */
function renderLesson(idx) {
  const l = S.lessons[idx];
  if (!l) { document.getElementById('view-lessons').innerHTML='<div class="loading-center">لا توجد دروس</div>'; return; }
  if (!lessonVisibleToStudent(l)) {
    document.getElementById('view-lessons').innerHTML = '<div class="status-banner info" style="margin:2rem">' + ic('info') + ' هذا الدرس غير متاح لصفك</div>';
    return;
  }
  const sc = S.scores[String(l.id)];
  const p = sc ? pct(sc.correct, sc.total) : null;
  const locked = !isLessonUnlocked(idx);
  const isSuspended = S.user?.status === 'suspended';
  const isBanned = S.user?.status === 'banned';
  const el = document.getElementById('view-lessons');
  let media = '';
  if (l.youtubeId) media = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${l.youtubeId}?modestbranding=1&rel=0" allowfullscreen loading="lazy"></iframe><div class="video-label">${ic('video')} ${l.title}</div></div>`;
  if (l.audio) media += `<div class="audio-wrap"><svg width="18" height="18"><use href="#ic-audio"/></svg><audio controls preload="none" style="flex:1"><source src="${l.audio}"></audio></div>`;
  const lockBanner = locked ? `<div class="lesson-locked-banner">${ic('lock')} <span>هذا الدرس مقفل. أكمل الدرس السابق أولاً (60% أو أعلى)</span></div>` : '';
  const suspBanner = (isSuspended||isBanned) ? `<div class="status-banner warn">${ic('alert')} <span>حسابك ${isBanned?'محظور':'معلق'} - يمكنك المشاهدة لكن لا يمكنك تقديم الاختبارات.</span></div>` : '';
  const bodyHtml = l.body ? `<div class="lesson-body">${l.body}</div>` : '';
  const prevBanner = sc ? `<div class="quiz-result show ${p>=60?'pass':'fail'}" style="margin-bottom:.85rem">${ic(p>=60?'check':'x')} درجتك السابقة: ${sc.correct}/${sc.total} (${p}%)</div>` : '';
  const qHtml = l.quiz?.qs?.length ? l.quiz.qs.map((q,qi)=>`
    <div class="q-block" id="lq-block-${idx}-${qi}">
      <div class="q-text">${qi+1}. ${q.q} ${q.type==='tf'?'<span class="badge b-purple" style="font-size:.58rem">صح/خطأ</span>':''}</div>
      <div class="q-opts">${q.os.map((o,oi)=>`<label class="q-opt" onclick="selOpt(this)"><input type="radio" name="lq_${idx}_${qi}" value="${oi}" data-oi="${oi}"> ${o}</label>`).join('')}</div>
    </div>`).join('') : '';
  const showQuiz = !locked && !isSuspended && !isBanned && l.quiz?.qs?.length;
  const visibleArr = S.lessons.filter(lessonVisibleToStudent);
  const displayNum = visibleArr.indexOf(l) + 1;
  el.innerHTML = `
    ${lockBanner}${suspBanner}
    <div class="lesson-card">
      <div class="lesson-tag">${ic('book')} الدرس ${displayNum} من ${visibleArr.length}</div>
      <div class="lesson-title">${l.title}</div>
      ${l.titleEn ? `<div class="lesson-sub">${l.titleEn}</div>` : ''}
      <div class="lesson-divider"></div>
      ${media}${bodyHtml}
      ${showQuiz ? `
      <div class="quiz-acc">
        <div class="quiz-acc-hdr" onclick="toggleAcc(this)">
          <div class="quiz-acc-title">${ic('clip')} اختبار الدرس - ${l.quiz.qs.length} أسئلة</div>
          <svg class="quiz-acc-arrow" width="18" height="18"><use href="#ic-chevron-d"/></svg>
        </div>
        <div class="quiz-acc-body">${prevBanner}${qHtml}
          <button class="btn-quiz" onclick="submitLessonQuiz(${idx})">${ic('send')} تقديم الإجابات</button>
          <div class="quiz-result" id="lqr-${idx}"></div>
        </div>
      </div>` : ''}
    </div>
    <div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.35rem">
      ${idx>0 ? `<button class="btn-secondary" onclick="goLesson(${idx-1})">${ic('arrow-l')} السابق</button>` : ''}
      ${idx<S.lessons.length-1 ? `<button class="btn-teal" onclick="goLesson(${idx+1})">التالي ${ic('arrow-r')}</button>` : ''}
    </div>`;
}
function toggleAcc(hdr) {
  const body = hdr.nextElementSibling;
  const arrow = hdr.querySelector('.quiz-acc-arrow');
  const open = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}
function selOpt(label) {
  const r = label.querySelector('input'); if(r) r.checked=true;
  label.closest('.q-opts').querySelectorAll('.q-opt').forEach(o=>o.classList.remove('selected'));
  label.classList.add('selected');
}
function refreshProgressUI() {
  if (!S.isAdmin) {
    if (!document.getElementById('view-dash')?.classList.contains('hidden')) renderDash();
    if (!document.getElementById('view-exams')?.classList.contains('hidden')) renderExams();
  }
  buildSb();
}
function markQuestionFeedback(blockId, correctIdx, chosenIdx) {
  const block = document.getElementById(blockId); if (!block) return;
  block.querySelectorAll('.q-opt').forEach(label => {
    const input = label.querySelector('input');
    const oi = parseInt(input.dataset.oi);
    label.classList.remove('selected');
    label.classList.add('locked');
    input.disabled = true;
    if (oi === correctIdx) label.classList.add('correct-opt');
    else if (oi === chosenIdx) label.classList.add('wrong-opt');
  });
}
async function submitLessonQuiz(idx) {
  if (S.user?.status === 'suspended' || S.user?.status === 'banned') { toast('حسابك ' + (S.user.status==='banned'?'محظور':'معلق'),'warn'); return; }
  const l = S.lessons[idx];
  if (S.scores[String(l.id)] && !confirm('أجريت هذا الاختبار مسبقاً. هل تريد الإعادة؟')) return;
  let correct = 0;
  l.quiz.qs.forEach((q,qi) => {
    const sel = document.querySelector(`input[name="lq_${idx}_${qi}"]:checked`);
    const chosenIdx = sel ? parseInt(sel.value) : -1;
    if (chosenIdx===q.c) correct++;
    markQuestionFeedback(`lq-block-${idx}-${qi}`, q.c, chosenIdx);
  });
  const total = l.quiz.qs.length;
  const p = pct(correct, total);
  await saveScore('lesson', l.id, correct, total);
  const res = document.getElementById(`lqr-${idx}`);
  if (res) { res.className=`quiz-result show ${p>=60?'pass':'fail'}`; res.innerHTML=`${ic(p>=60?'check':'x')} ${correct}/${total} (${p}%)`; }
  buildSb(); setSbActive(idx);
  refreshProgressUI();
  toast(`درجتك: ${p}%`, p>=60?'ok':'warn');
}

/* ==================== EXAMS VIEW (FILTERS OUT EMPTY) ==================== */
function getAllExams() {
  const lessonExams = S.lessons
    .filter(lessonVisibleToStudent)
    .filter(l => (l.exam?.qs?.length || 0) > 0)
    .map(l => ({
      type: 'lesson',
      _key: `lesson_${l.id}`,
      title: l.exam.title || `امتحان: ${l.title}`,
      passing: l.exam.passing || 60,
      qs: l.exam.qs,
      _lessonTitle: l.title,
      _lessonId: l.id,
    }));
  const compExams = S.examsExtra
    .filter(examVisibleToStudent)
    .filter(e => (e.qs?.length || 0) > 0)
    .map(e => ({
      type: 'comprehensive',
      _key: `exam_${e.id}`,
      title: e.title,
      passing: e.passing || 60,
      qs: e.qs,
      lessonIds: e.lessonIds || [],
      classIds: e.classIds || [],
    }));
  return [...lessonExams, ...compExams];
}
function renderExams() {
  const el = document.getElementById('view-exams');
  const all = getAllExams();
  const cards = all.map((exam) => {
    const sc = S.exScores[exam._key];
    const p = sc ? pct(sc.correct, sc.total) : null;

    return `<div class="exam-card" onclick='openExamModal("${exam._key}")'>
      <div class="exam-num ${isComp?'comp':''}">${isComp?'امتحان شامل':'امتحان درس'}</div>

        <div class="exam-title">${exam.title}</div>
        ${p!==null ? getBadge(p) : '<span class="badge b-dim">جديد</span>'}
      </div>
      <div class="exam-meta" style="margin-top:.35rem">${ic('clip')} ${exam.qs?.length||0} سؤال - ${ic('check')} نجاح ${exam.passing}%</div>
      ${sc ? `<div style="margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line)">
        <div class="progress-bar"><div class="${getPct(p)}" style="width:${p}%"></div></div>
        <div style="font-size:.7rem;color:var(--text2);margin-top:.3rem">${sc.correct}/${sc.total}</div>
      </div>` : ''}
    </div>`;
  }).join('') || '<p class="muted" style="padding:1rem">لا توجد امتحانات متاحة حالياً</p>';
  el.innerHTML = `
    <div class="page-hdr">
      <div class="page-title">${ic('clip')} الامتحانات</div>
      <div class="page-sub">امتحان لكل درس + امتحانات شاملة</div>

function closeExamModal() { document.getElementById('exam-modal').classList.add('hidden'); S.currentExam=null; }
async function submitExamModal() {

async function renderDash() {

  const hasScores = allPcts.length > 0;
  const avg = hasScores ? Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length) : null;
  const pctDone = total > 0 ? Math.round((done/total)*100) : 0;
  const compDone = visibleCompExams.filter(e => S.exScores[`exam_${e.id}`]).length;

  const compAvg = compPcts.length ? Math.round(compPcts.reduce((a,b)=>a+b,0)/compPcts.length) : null;

  const rows = visibleLessons.length ? visibleLessons.map(l => {

      <td>${l.title}</td>
      <td style="text-align:center">${sc?sc.correct+'/'+sc.total:'-'}</td>
      <td style="text-align:center">${p!==null?p+'%':'-'}</td>
      <td style="text-align:center">${getBadge(p)}</td>

  }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:1rem">لا توجد دروس متاحة لصفك</td></tr>';

  const compRows = visibleCompExams.length ? visibleCompExams.map(e => {
    const sc = S.exScores[`exam_${e.id}`];
    const p = sc ? pct(sc.correct, sc.total) : null;
    const passing = e.passing || 60;
    const passed = p !== null && p >= passing;
    return `<tr>
      <td>${e.title}</td>
      <td style="text-align:center">${sc?sc.correct+'/'+sc.total:'-'}</td>
      <td style="text-align:center">${p!==null?p+'%':'-'}</td>
      <td style="text-align:center">${p!==null ? (passed ? `<span class="badge b-green">ناجح ${p}%</span>` : `<span class="badge b-red">راسب ${p}%</span>`) : '<span class="badge b-dim">لم يؤدَ</span>'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text2);padding:1rem">لا توجد امتحانات شاملة متاحة لصفك</td></tr>';

  el.innerHTML = `

function drawChart(wrapId, values) {
  const wrap = document.getElementById(wrapId); if(!wrap) return;
  const W = wrap.clientWidth || 600; const H = 250;
  wrap.innerHTML = `<canvas class="chart-canvas" width="${W}" height="${H}"></canvas>`;
  const cv = wrap.querySelector('canvas'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const pd={t:28,r:18,b:40,l:42};
  const pw=W-pd.l-pd.r; const ph=H-pd.t-pd.b;
  const n = Math.max(values.length, 1);
  const bw = Math.min((pw/n) * .55, 50); const bg = pw/n;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(10,15,26,.4)'; ctx.fillRect(0,0,W,H);
  [0,25,50,75,100].forEach(p=>{
    const y=pd.t+ph*(1-p/100);
    ctx.strokeStyle='rgba(255,255,255,.045)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pd.l,y); ctx.lineTo(W-pd.r,y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font=`10px 'IBM Plex Sans Arabic'`;
    ctx.textAlign='right'; ctx.fillText(p+'%',pd.l-4,y+4);
  });
  values.forEach((val,i)=>{
    const x = pd.l + i*bg + (bg-bw)/2;
    const h = val!==null ? (val/100)*ph : 0;
    const y = pd.t + ph - h;
    const gr = ctx.createLinearGradient(x,y,x,pd.t+ph);
    if (val===null) { gr.addColorStop(0,'rgba(255,255,255,.05)'); gr.addColorStop(1,'rgba(255,255,255,.01)'); }
    else if (val>=70) { gr.addColorStop(0,'#2dd4bf'); gr.addColorStop(1,'rgba(45,212,191,.1)'); }
    else if (val>=60) { gr.addColorStop(0,'#fbbf24'); gr.addColorStop(1,'rgba(251,191,36,.1)'); }
    else { gr.addColorStop(0,'#f87171'); gr.addColorStop(1,'rgba(248,113,113,.08)'); }
    ctx.fillStyle = gr;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, bw, Math.max(h,2), [5,5,0,0]);
    else ctx.rect(x, y, bw, Math.max(h,2));
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font=`9px 'IBM Plex Sans Arabic'`; ctx.textAlign='center';
    ctx.fillText(i+1, x+bw/2, pd.t+ph+16);
    if (val!==null) { ctx.fillStyle='#fff'; ctx.font=`bold 9px 'IBM Plex Sans Arabic'`; ctx.fillText(val+'%', x+bw/2, y-7); }
  });
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(pd.l,pd.t); ctx.lineTo(pd.l,pd.t+ph); ctx.lineTo(W-pd.r,pd.t+ph); ctx.stroke();
}

async function updateMsgBadge() {
  const badge = document.getElementById('msg-badge');
  if (!badge || S.isAdmin || !S.user) return;
  try {
    const notifs = await Cloud.loadNotificationsFor(S.user.phone);
    const notifUnread = notifs.filter(n => !(n.seenBy||[]).includes(S.user.phone)).length;
    const msgs = await Cloud.loadMessagesFrom(S.user.phone);
    const seenKey = `edudar_seen_replies_${S.user.phone}`;
    const seen = JSON.parse(localStorage.getItem(seenKey) || '[]');
    let replyUnread = 0;
    msgs.forEach(m => (m.replies||[]).forEach(r => { if (!seen.includes(r.id)) replyUnread++; }));
    const total = notifUnread + replyUnread;
    if (total > 0) { badge.textContent = total; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  } catch(e) {}
}

/* --- Analytics --- */
function getStudentsByClassFilter(filter) {
  const all = getAllStudentsFromDb();
  if (!filter || filter === 'all') return { students: all, label: 'جميع الصفوف' };
  if (filter === 'none') return { students: all.filter(s => !s.classId), label: 'بدون صف' };
  const cls = S.classes.find(c => c.id === filter);
  return { students: all.filter(s => s.classId === filter), label: cls ? cls.name : 'صف محدد' };
}
function lessonVisibleToClass(lesson, classFilter) {
  if (!classFilter || classFilter === 'all') return true;
  const hasClasses = lesson.classIds && lesson.classIds.length;
  if (classFilter === 'none') return !hasClasses;
  if (!hasClasses) return true;
  return lesson.classIds.includes(classFilter);
}

function insertEditorCard(type) {

    danger: '<div class="card-danger"><b>خطر:</b> اكتب التحذير هنا</div>'
  };
  const html = '\n' + tpls[type] + '\n';
  if (_editorMode === 'html') {
    const ta = document.getElementById('html-editor');

function insertEditorTable() {

function addQ(type='lesson') {

  if (S.role !== 'admin') return;
  const classId = document.getElementById('poll-class').value;
  const question = document.getElementById('poll-question').value.trim();
  const optionsRaw = document.getElementById('poll-options').value.trim();
  if (!question || !optionsRaw) { toast('أدخل السؤال والخيارات','err'); return; }
  const options = optionsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  if (options.length < 2) { toast('خيارين على الأقل','err'); return; }
  const votes = {}; options.forEach((_, i) => votes[i] = []);
  await Cloud.createPoll({ id: genId('p'), classId, question, options, votes, created: new Date().toISOString() });
  toast('تم'); renderAdminMessages();
}

async function cloudDiagnostic() {
  const el = document.getElementById('cloud-diag-result');
  if (el) el.innerHTML = '<span class="badge b-amber"> جارٍ الفحص...</span>';
  try {
    const { data, error: rErr } = await sb.rpc('get_app_setting', { p_key: 'lessons_data' });
    if (rErr) throw new Error('قراءة lessons فشلت: ' + rErr.message);
    const cloudLessons = data?.[0]?.value?._lessons || [];
    let scoresCount = 0, msgsCount = 0, notifsCount = 0, pollsCount = 0;
    try { const r = await sb.from('student_scores').select('*', { count: 'exact', head: true }); scoresCount = r.count || 0; } catch {}
    try { const r = await sb.from('admin_messages').select('*', { count: 'exact', head: true }); msgsCount = r.count || 0; } catch {}
    try { const r = await sb.from('notifications').select('*', { count: 'exact', head: true }); notifsCount = r.count || 0; } catch {}
    try { const r = await sb.from('polls').select('*', { count: 'exact', head: true }); pollsCount = r.count || 0; } catch {}
    const msg = `السحابة: ${cloudLessons.length} درس
درجات الطلاب: ${scoresCount}
رسائل: ${msgsCount} — إشعارات: ${notifsCount} — تصويتات: ${pollsCount}`;
    if (el) el.innerHTML = `<div class="notif-row" style="flex-direction:column;align-items:flex-start;font-family:var(--mono);font-size:.73rem;gap:.3rem;white-space:pre">${msg}</div>`;
    _setCloudStatus('ok');
  } catch(e) {
    if (el) el.innerHTML = `<div class="notif-row" style="border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06);color:var(--red)">فشل: ${e.message}</div>`;
    _setCloudStatus('err', e.message);
  }
}

  if (S.role !== 'admin') return;

  if (ok) toast('تم الحفظ على السحابة', 'ok'); else toast('فشل الحفظ', 'err', 5000);

async function forceLoadCloud() {
  const el = document.getElementById('cloud-diag-result');
  if (el) el.innerHTML = '<span class="badge b-amber"> جارٍ التحميل...</span>';
  const cloudData = await Cloud.loadLessons();
  if (!cloudData?._lessons?.length) { toast('السحابة فارغة', 'warn'); return; }
  _applyCloudData(cloudData);
  if (S.isAdmin) renderAdminTab(); else { buildSb(); renderLesson(S.lessonIdx); }
  toast(`تم تحميل ${cloudData._lessons.length} درس`, 'ok');
  await cloudDiagnostic();
}
function exportBackup() {
  const data = { ...lsGet(), _exported: new Date().toISOString(), _version: 'edudar_v9' };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `edudar-backup-${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('تم التصدير');
}
function importData(inp) {
  if (S.role !== 'admin') return;
  const file = inp.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('سيتم استبدال جميع البيانات. متابعة؟')) return;
      localStorage.setItem(LS, JSON.stringify(data));
      toast('جارٍ إعادة التحميل...');
      setTimeout(()=>location.reload(), 800);
    } catch(err) { toast('ملف غير صالح','err'); }
  };
  r.readAsText(file);
}
function resetAll() {
  if (S.role !== 'admin') return;
  if (!confirm('سيتم حذف كل البيانات. متابعة؟')) return;
  if (!confirm('تأكيد نهائي؟')) return;
  localStorage.removeItem(LS);
  Object.keys(localStorage).filter(k=>k.startsWith('edudar_seen_replies_')).forEach(k=>localStorage.removeItem(k));
  toast('تم','warn');
  setTimeout(()=>location.reload(), 800);
}

function getFilteredStudentsForPdf(filterOverride) {
  let filter = filterOverride;
  if (filter === undefined || filter === null || filter === '') {
    const el = document.getElementById('pdf-class-filter');
    filter = el ? el.value : 'all';
  }
  return getStudentsByClassFilter(filter);
}
async function exportStudentListPdf(filterOverride) {
  const { students, label } = getFilteredStudentsForPdf(filterOverride);
  if (!students.length) { toast('لا يوجد طلاب','warn'); return; }
  const allScores = await Cloud.loadAllScores();
  let rows = '';
  let totalAvg = 0; let countWithScores = 0;
  students.forEach(s => {
    const sc = {};
    allScores.filter(r => r.student_id === s.phone && r.type === 'lesson').forEach(r => { sc[r.ref_id] = { correct: r.correct, total: r.total }; });
    const done = Object.keys(sc).length;
    const pcts = Object.values(sc).map(v => pct(v.correct, v.total));
    const avg = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;
    if (pcts.length) { totalAvg += avg; countWithScores++; }
    const cls = S.classes.find(c=>c.id===s.classId)?.name || 'بدون صف';
    rows += `<tr><td>${s.name||'-'}</td><td style="direction:ltr">${s.phone}</td><td>${cls}</td><td>${done}/${S.lessons.length}</td><td>${pcts.length ? avg+'%' : '-'}</td></tr>`;
  });
  const overallAvg = countWithScores ? Math.round(totalAvg/countWithScores) : 0;
  const body = `<h1>قائمة الطلاب - ${label}</h1><div class="meta">${new Date().toLocaleString('ar-EG')} - ${students.length} طالب</div>
    <div class="summary"><div class="stat"><div class="stat-val">${students.length}</div><div class="stat-lbl">الطلاب</div></div>
    <div class="stat"><div class="stat-val">${overallAvg}%</div><div class="stat-lbl">المتوسط</div></div></div>
    <table><thead><tr><th>الاسم</th><th>الرقم</th><th>الصف</th><th>الدروس</th><th>المتوسط</th></tr></thead><tbody>${rows}</tbody></table>`;
  openPdfWindow('قائمة الطلاب - ' + label, body);
}
async function exportComprehensiveResultsPdf(filterOverride) {
  const { students, label } = getFilteredStudentsForPdf(filterOverride);
  const compExams = S.examsExtra.filter(e => e.type === 'comprehensive' && (e.qs?.length||0) > 0);
  if (!students.length) { toast('لا يوجد طلاب','warn'); return; }
  if (!compExams.length) { toast('لا توجد امتحانات شاملة','warn'); return; }
  const allScores = await Cloud.loadAllScores();
  let headerCols = '';
  compExams.forEach(e => headerCols += `<th>${e.title}<br><span style="font-size:10px">نجاح ${e.passing}%</span></th>`);
  let rows = '';
  students.forEach(s => {
    const ex = {};
    allScores.filter(r => r.student_id === s.phone && r.type === 'exam').forEach(r => { ex[r.ref_id] = { correct: r.correct, total: r.total }; });
    let cols = '';
    compExams.forEach(e => {
      const score = ex[`exam_${e.id}`];
      if (score) {
        const p = pct(score.correct, score.total);
        cols += `<td><span class="badge ${p >= e.passing ? 'b-pass' : 'b-fail'}">${p}% (${score.correct}/${score.total})</span></td>`;
      } else cols += `<td><span class="badge b-none">لم يُختبر</span></td>`;
    });
    rows += `<tr><td>${s.name||'-'}</td><td style="direction:ltr">${s.phone}</td>${cols}</tr>`;
  });
  const body = `<h1>النتائج الشاملة - ${label}</h1><div class="meta">${new Date().toLocaleString('ar-EG')}</div>
    <table><thead><tr><th>الاسم</th><th>الرقم</th>${headerCols}</tr></thead><tbody>${rows}</tbody></table>`;
  openPdfWindow('النتائج الشاملة - ' + label, body);
}
async function exportStudentReportPdf(phone) {
  const stu = findUserByPhone(phone) || (S.user && S.user.phone===phone ? S.user : null);
  if (!stu) return;
  const { scores, exScores } = await Cloud.loadStudentScores(phone);
  const cls = S.classes.find(c=>c.id===stu.classId)?.name || 'بدون صف';
  let rows = '';
  S.lessons.filter(lessonVisibleToStudent).forEach(l => {
    const s = scores[String(l.id)];
    const p = s ? pct(s.correct, s.total) : null;
    let badge = '<span class="badge b-none">لم يُختبر</span>';
    if (s) badge = `<span class="badge ${p >= 60 ? 'b-pass' : 'b-fail'}">${p}% (${s.correct}/${s.total})</span>`;
    rows += `<tr><td>${l.title}</td><td>${s ? s.correct+'/'+s.total : '-'}</td><td>${badge}</td></tr>`;
  });
  const compRows = S.examsExtra.filter(e => e.type === 'comprehensive' && (e.qs?.length||0) > 0).map(e => {
    const s = exScores[`exam_${e.id}`];
    const p = s ? pct(s.correct, s.total) : null;
    let badge = '<span class="badge b-none">لم يُختبر</span>';
    if (s) badge = `<span class="badge ${p >= (e.passing||60) ? 'b-pass' : 'b-fail'}">${p}% (${s.correct}/${s.total})</span>`;
    return `<tr><td>${e.title}</td><td>${s ? s.correct+'/'+s.total : '-'}</td><td>${badge}</td></tr>`;
  }).join('');
  const body = `<h1>تقرير الطالب - Edudar</h1>
    <div class="meta">الاسم: <b>${stu.name||'-'}</b> - الرقم: <b>${stu.phone}</b><br>الصف: <b>${cls}</b><br>${new Date().toLocaleString('ar-EG')}</div>
    <h2 style="color:#0f9d8b;font-size:16px;margin-top:20px">درجات الدروس</h2>
    <table><thead><tr><th>الدرس</th><th>الإجابات</th><th>التقييم</th></tr></thead><tbody>${rows}</tbody></table>
    ${compRows ? `<h2 style="color:#0f9d8b;font-size:16px;margin-top:20px">الامتحانات الشاملة</h2>
    <table><thead><tr><th>الامتحان</th><th>الإجابات</th><th>النتيجة</th></tr></thead><tbody>${compRows}</tbody></table>` : ''}`;
  openPdfWindow('تقرير الطالب', body);
}
